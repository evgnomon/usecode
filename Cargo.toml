[workspace]
resolver = "3"
members = [
    "lib/annabelle",
    "lib/ansidist",
    "lib/api",
    "lib/backup_archive",
    "lib/barge",
    "lib/bot",
    "lib/catalyze",
    "lib/certgen",
    "lib/confmap",
    "lib/csv2pdf",
    "lib/daemon",
    "lib/diga",
    "lib/docker",
    "lib/extract-tool",
    "lib/ff",
    "lib/fzurls",
    "lib/git_repos",
    "lib/gotorepo",
    "lib/hgl",
    "lib/imgpress",
    "lib/ipmesh",
    "lib/jsonc",
    "lib/k8s_ddl",
    "lib/mgo",
    "lib/mkarole",
    "lib/mkdeb",
    "lib/mkp12",
    "lib/mkpod",
    "lib/mkunit",
    "lib/natsup",
    "lib/num_argv",
    "lib/pg",
    "lib/plat",
    "lib/pubdeb",
    "lib/repofqn",
    "lib/secd",
    "lib/set_git_conf",
    "lib/shole",
    "lib/sqlize",
    "lib/tidycsv",
    "lib/trust_ca",
    "lib/uc",
    "lib/ucversion",
    "lib/vi",
    "lib/vm",
    "lib/wdoctl",
    "lib/whcloud",
    "lib/workd",
    "lib/x",
    "lib/y",
    "lib/yacht",
    "lib/ykattach",
    "lib/ysys",
    "lib/ytdump",
    "lib/zcdump",
]

[workspace.package]
edition = "2024"
license = "HGL"
authors = ["Hamed Ghasemzadeh <hg@evgnomon.org>"]

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
clap = "4.6.7"
dotenvy = "0.15"
getrandom = "0.3"
libc = "0.2"
minijinja = "2"
postgres = "0.19"
regex = "1.13.1"
reqwest = { version = "0.13", default-features = false }
rpassword = "7"
serde = "1"
serde_json = "1"
serde_yaml = "0.9"
tempfile = "3"
thiserror = "2"
tokio = "1"
toml = "1"
uuid = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1

# Quick to rebuild, for the local compose stack (see lib/api/Containerfile).
[profile.local]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
