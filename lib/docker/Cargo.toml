[package]
name = "docker"
version = "0.1.0"
edition = "2024"
description = "Docker wrapper using ~/.docker config with sudo fallback for unwritable sockets"
license = "HGL"
authors = ["Hamed Ghasemzadeh <hg@evgnomon.org>"]
publish = false

[[bin]]
name = "docker"
path = "src/main.rs"

[dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
