[package]
name = "workd"
version = "0.1.0"
edition.workspace = true
description = "A lightweight, portable, and user-friendly workflow manager for Linux."
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "workd"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
chrono = "0.4"
clap = { workspace = true, features = ["derive", "env"] }
gethostname = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "sync", "time"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
uuid = { workspace = true, features = ["v4"] }
