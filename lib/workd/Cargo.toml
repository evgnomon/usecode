[package]
name = "workd"
version = "0.1.0"
edition = "2024"
description = "A lightweight, portable, and user-friendly workflow manager for Linux."
license = "HGL"
authors = ["Hamed Ghasemzadeh <hg@evgnomon.org>"]
publish = false

[[bin]]
name = "workd"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
gethostname = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
