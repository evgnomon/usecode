[package]
name = "uc"
version = "0.1.0"
edition = "2024"
description = "usecode command line tool and its OpenSSL-compatible file encryption subcommands"
authors = ["Hamed Ghasemzadeh <hg@evgnomon.org>"]

[lib]
name = "uc"
path = "src/lib.rs"

[[bin]]
name = "uc"
path = "src/bin/uc.rs"

[[bin]]
name = "uc-encrypt"
path = "src/bin/uc-encrypt.rs"

[[bin]]
name = "uc-decrypt"
path = "src/bin/uc-decrypt.rs"

[dependencies]
aes = "0.9"
base64 = "0.23"
cbc = "0.2"
getrandom = "0.3"
md-5 = "0.11"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
rpassword = "7"
sha2 = "0.11"
zeroize = "1"

[profile.release]
strip = true
