[package]
name = "uc"
version = "0.1.0"
edition = "2024"
description = "usecode command line tool, its OpenSSL-compatible file encryption subcommands, the parallel machine configurator and the container registry push/pull"
license = "HGL"
authors = ["Hamed Ghasemzadeh <hg@evgnomon.org>"]

[lib]
name = "uc"
path = "src/lib.rs"

[[bin]]
name = "uc"
path = "src/bin/uc.rs"

[[bin]]
name = "uc-encrypt"
path = "src/bin/uc-encrypt.rs"

[[bin]]
name = "uc-decrypt"
path = "src/bin/uc-decrypt.rs"

[[bin]]
name = "uc-configure"
path = "src/bin/uc-configure.rs"

[[bin]]
name = "uc-push"
path = "src/bin/uc-push.rs"

[[bin]]
name = "uc-pull"
path = "src/bin/uc-pull.rs"

[dependencies]
aes = "0.9"
anyhow = "1"
base64 = "0.23"
cbc = "0.2"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.3"
md-5 = "0.11"
minijinja = "2"
minijinja-contrib = { version = "2", features = ["pycompat"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time", "io-util"] }
zeroize = "1"

[profile.release]
strip = true
