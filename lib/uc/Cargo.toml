[package]
name = "uc"
version = "0.1.0"
edition.workspace = true
description = "usecode command line tool, its OpenSSL-compatible file encryption subcommands, the parallel machine configurator and the container registry push/pull, GHCR image management, the secret stores and the command groups over the usecode tools"
license.workspace = true
authors.workspace = true

[lib]
name = "uc"
path = "src/lib.rs"

[[bin]]
name = "uc"
path = "src/bin/uc.rs"

[[bin]]
name = "uc-secret-encrypt"
path = "src/bin/uc-secret-encrypt.rs"

[[bin]]
name = "uc-secret-decrypt"
path = "src/bin/uc-secret-decrypt.rs"

[[bin]]
name = "uc-configure"
path = "src/bin/uc-configure.rs"

[[bin]]
name = "uc-push"
path = "src/bin/uc-push.rs"

[[bin]]
name = "uc-pull"
path = "src/bin/uc-pull.rs"

[[bin]]
name = "uc-ghcr"
path = "src/bin/uc-ghcr.rs"

[[bin]]
name = "uc-secret"
path = "src/bin/uc-secret.rs"

[[bin]]
name = "uc-image"
path = "src/bin/uc-image.rs"

[[bin]]
name = "uc-repo"
path = "src/bin/uc-repo.rs"

[[bin]]
name = "uc-cert"
path = "src/bin/uc-cert.rs"

[[bin]]
name = "uc-deb"
path = "src/bin/uc-deb.rs"

[[bin]]
name = "uc-db"
path = "src/bin/uc-db.rs"

[[bin]]
name = "uc-net"
path = "src/bin/uc-net.rs"

[[bin]]
name = "uc-vm"
path = "src/bin/uc-vm.rs"

[[bin]]
name = "uc-new"
path = "src/bin/uc-new.rs"

[[bin]]
name = "uc-cloud"
path = "src/bin/uc-cloud.rs"

[[bin]]
name = "uc-agent"
path = "src/bin/uc-agent.rs"

[[bin]]
name = "uc-data"
path = "src/bin/uc-data.rs"

[[bin]]
name = "uc-media"
path = "src/bin/uc-media.rs"

[[bin]]
name = "uc-pick"
path = "src/bin/uc-pick.rs"

[[bin]]
name = "uc-sys"
path = "src/bin/uc-sys.rs"

[dependencies]
aes = "0.9"
anyhow.workspace = true
base64 = "0.23"
cbc = "0.2"
clap = { workspace = true, features = ["derive", "env"] }
getrandom.workspace = true
libc.workspace = true
md-5 = "0.11"
minijinja.workspace = true
minijinja-contrib = { version = "2", features = ["pycompat"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
rpassword.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
serde = { workspace = true, features = ["derive"] }
serde_yaml.workspace = true
sha1 = "0.11"
sha2 = "0.11"
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread", "sync", "time", "io-util"] }
zeroize = "1"
