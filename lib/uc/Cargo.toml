[package]
name = "uc"
version = "0.1.0"
edition = "2024"
description = "usecode command line tool, its OpenSSL-compatible file encryption subcommands, the parallel machine configurator and the container registry push/pull, GHCR image management, the secret stores and the command groups over the usecode tools"
license = "HGL"
authors = ["Hamed Ghasemzadeh <hg@evgnomon.org>"]

[lib]
name = "uc"
path = "src/lib.rs"

[[bin]]
name = "uc"
path = "src/bin/uc.rs"

[[bin]]
name = "uc-encrypt"
path = "src/bin/uc-encrypt.rs"

[[bin]]
name = "uc-decrypt"
path = "src/bin/uc-decrypt.rs"

[[bin]]
name = "uc-configure"
path = "src/bin/uc-configure.rs"

[[bin]]
name = "uc-push"
path = "src/bin/uc-push.rs"

[[bin]]
name = "uc-pull"
path = "src/bin/uc-pull.rs"

[[bin]]
name = "uc-ghcr"
path = "src/bin/uc-ghcr.rs"

[[bin]]
name = "uc-secret"
path = "src/bin/uc-secret.rs"

[[bin]]
name = "uc-image"
path = "src/bin/uc-image.rs"

[[bin]]
name = "uc-repo"
path = "src/bin/uc-repo.rs"

[[bin]]
name = "uc-cert"
path = "src/bin/uc-cert.rs"

[[bin]]
name = "uc-deb"
path = "src/bin/uc-deb.rs"

[[bin]]
name = "uc-db"
path = "src/bin/uc-db.rs"

[[bin]]
name = "uc-net"
path = "src/bin/uc-net.rs"

[[bin]]
name = "uc-vm"
path = "src/bin/uc-vm.rs"

[[bin]]
name = "uc-nats"
path = "src/bin/uc-nats.rs"

[[bin]]
name = "uc-work"
path = "src/bin/uc-work.rs"

[[bin]]
name = "uc-new"
path = "src/bin/uc-new.rs"

[[bin]]
name = "uc-cloud"
path = "src/bin/uc-cloud.rs"

[dependencies]
aes = "0.9"
anyhow = "1"
base64 = "0.23"
cbc = "0.2"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.3"
libc = "0.2"
md-5 = "0.11"
minijinja = "2"
minijinja-contrib = { version = "2", features = ["pycompat"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
rpassword = "7"
serde_json = { version = "1", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time", "io-util"] }
zeroize = "1"

[profile.release]
strip = true
