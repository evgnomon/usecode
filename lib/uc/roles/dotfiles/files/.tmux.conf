set-option -g default-command /bin/bash
set -g mouse off
setw -g mode-keys vi
set -g status-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'wl-copy'
set-option -g history-limit 1000000
set-option -g history-limit 1000000
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"
# Don't use the alternate screen, so the terminal (Alacritty) keeps its own scrollback
set -ga terminal-overrides ",*:smcup@:rmcup@"
set -g set-titles on
set -g set-titles-string "#T"
set -g status off
set -g status-left ""
set -g status-right ""

# Colors by their ANSI names, so they follow the Gruvbox theme Alacritty
# loads: black is the background in both, white the dimmed text.
set -g status-style bg=default,fg=default
set -g status-left-length 40
set -g status-right-length 80

# Status left (session name)
set -g status-left "#[fg=black,bg=green,bold] #S #[fg=green,bg=default]"

# Window status
set -g window-status-format "#[fg=white,bg=default] #I:#W "
set -g window-status-current-format "#[fg=black,bg=yellow,bold] #I:#W #[fg=yellow,bg=default]"

# Pane borders
set -g pane-border-style fg=brightblack
set -g pane-active-border-style fg=green

# Message styling
set -g message-style bg=yellow,fg=black
set -g message-command-style bg=default,fg=default

# Pane number display
set -g display-panes-active-colour green
set -g display-panes-colour yellow

# Clock mode
set -g clock-mode-colour green

# Copy mode highlighting
set -g mode-style bg=yellow,fg=black

# Refresh status bar every 30 seconds (don't spam the API)
set -g status-interval 30

# For Claude Code
set -g focus-events on
