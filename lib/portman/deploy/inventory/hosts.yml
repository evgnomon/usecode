---
# The portman mesh: who is in it.
#
# This file, group_vars/portman/ and host_vars/ together are the mesh
# topology - the one place that decides which hosts exist and what
# address each one holds. Nothing is decided on a host itself, which is
# what keeps two hosts from ever being handed the same tunnel address.
#
# Add members with `portman add NAME` from a checkout of this repo; it
# appends the host below, writes host_vars/NAME.yml with the address it
# allocated and the public key it minted, and puts the private key in
# group_vars/portman/secrets.yml (ansible-vault). Then converge every
# host with, from the repo root:
#
#   ansible-playbook deploy/playbooks/portman.yml
all:
  children:
    portman:
      hosts:
        shadow: {}
        hameds-desktop: {}
