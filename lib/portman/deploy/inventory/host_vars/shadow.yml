---
# shadow - one member of the portman mesh.
#
# Created by `portman add shadow`, and not touched by portman again:
# edit it freely. portman_address was allocated from portman_network in
# group_vars/portman/main.yml, and the private key half of
# portman_public_key is in group_vars/portman/secrets.yml under this host's
# name.
ansible_user: root
portman_address: 10.10.0.1
portman_public_key: pcXnoHrJs2ht+9NYHxCm6UBJX0PK40u3KSSUuxrLFW0=
# shadow has a public address, so every other member dials it and it
# never has to dial out - it learns their endpoints from the handshake.
# Without this nobody in the mesh has anyone to dial and no handshake
# ever happens.
portman_endpoint: shadow.clusterlean.net:51820
portman_services: []
