[defaults]
# The repo root is where ansible runs from - ansible only reads
# ansible.cfg from the current directory, so keeping the one copy here
# means `ansible-playbook deploy/playbooks/portman.yml` works from a
# fresh checkout with no flags. Run it anywhere else and roles_path is
# lost, which silently resolves the `portman` role to whatever `portman`
# is next to you (the built binary, for instance) and runs no tasks at
# all.
inventory = deploy/inventory
roles_path = roles

# group_vars/portman/secrets.yml is vaulted, so every run needs the vault
# password; without one of these ansible doesn't ask for it and fails the
# play with "Attempting to decrypt but no vault secrets found".
#
# vault-pass.sh is executable, so ansible runs it and takes the password
# from its stdout - the password itself is never on disk here. Relative
# to the repo root, like the paths above, so it resolves for `portman
# add` too. Setting both this and ask_vault_pass is an error.
vault_password_file = deploy/vault-pass.sh
# ask_vault_pass = True

[privilege_escalation]
# The playbook runs with become: true, and the control node is a member of
# the mesh - it converges over a local connection, so become there is a
# plain sudo that wants a password. Without this ansible never asks and the
# host fails with "sudo: a password is required".
#
# This is the same as passing -K, so no flags are needed. Hosts reached as
# root (shadow) are handed the password and ignore it. Give the control
# node passwordless sudo and this can go away.
become_ask_pass = True
