[package]
name = "annabelle"
version = "0.1.0"
edition.workspace = true
description = "Run a local script and upload files on multiple remote servers via SSH/SCP"
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "annabelle"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
