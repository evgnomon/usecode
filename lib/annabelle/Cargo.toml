[package]
name = "annabelle"
version = "0.1.0"
edition = "2024"
description = "Run a local script and upload files on multiple remote servers via SSH/SCP"
license = "HGL"
authors = ["Hamed Ghasemzadeh <hg@evgnomon.org>"]
publish = false

[[bin]]
name = "annabelle"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
