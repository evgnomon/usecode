[package]
name = "getsecret"
version = "0.1.0"
edition = "2024"
description = "Decrypt an ansible-vault secret file and print it as JSON"
license = "HGL"
authors = ["Hamed Ghasemzadeh <hg@evgnomon.org>"]
publish = false

[[bin]]
name = "getsecret"
path = "src/main.rs"

[dependencies]
libc = "0.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
