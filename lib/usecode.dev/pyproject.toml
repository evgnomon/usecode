[project]
name = "usecode-dev-site"
version = "0.1.0"
description = "usecode.dev — website for the usecode infrastructure provisioner MCP"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Hamed Ghasemzadeh", email = "hg@evgnomon.org" }
]
dependencies = [
    "fastapi>=0.139.0",
    "jinja2>=3.1.0",
    "uvicorn[standard]>=0.51.0",
]

[project.scripts]
usecode-dev-site = "usecode_dev_site:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = []
