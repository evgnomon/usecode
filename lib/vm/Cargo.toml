[package]
name = "vm"
version = "0.7.0"
edition = "2024"
description = "A lightweight KVM/QEMU virtual machine creation tool"
authors = ["Hamed Ghasemzadeh <hg@evgnomon.org>"]

[lib]
name = "vm"
path = "src/lib.rs"

[[bin]]
name = "vm"
path = "src/main.rs"

[build-dependencies]
cc = "1"

[profile.release]
strip = true
