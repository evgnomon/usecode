[package]
name = "mgo"
version = "0.1.0"
edition.workspace = true
description = "MongoDB / Azure Cosmos DB (MongoDB API) CLI for local podman instances, collection management and JSON queries"
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "uc-db-mongo"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "alloc"] }
clap = { workspace = true, features = ["derive"] }
mongodb = { version = "3", features = ["sync"] }
serde_json = { workspace = true, features = ["preserve_order"] }
