[package]
name = "tidycsv"
version = "0.1.0"
edition.workspace = true
description = "Align CSV columns with padding so the file is readable in plain text editors"
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "uc-data-tidy"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
