[package]
name = "tidycsv"
version = "0.1.0"
edition = "2024"
description = "Align CSV columns with padding so the file is readable in plain text editors"
license = "HGL"
authors = ["Hamed Ghasemzadeh <hg@evgnomon.org>"]
publish = false

[[bin]]
name = "tidycsv"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
