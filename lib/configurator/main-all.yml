- name: Install Pip packages
  gather_facts: false
  hosts:
    - all
    - localhost
  roles:
    - python

- name: Install Rust packages
  gather_facts: false
  hosts:
    - all
    - localhost
  roles:
    - ensure_rust
  tags:
    - rust

- name: Install C# Language Server
  gather_facts: false
  hosts:
    - all
    - localhost
  roles:
    - ensure_csharp_ls
  tags:
    - cs

- name: Install Goose CLI
  gather_facts: false
  hosts:
    - all
    - localhost
  roles:
    - goose
  tags:
    - goose

- name: Install package roles
  gather_facts: false
  hosts:
    - all
    - localhost
  roles:
    - digitalocean_galaxy_collection
