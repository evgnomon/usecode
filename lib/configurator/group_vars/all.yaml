---
blueprint_user: "{{ ansible_facts['user_id'] }}"
go_latest_version: 1.21.6
python_version: "3.14.3"
home: "{{ lookup('env', 'HOME') }}"
target_home: "{{ ansible_facts['env']['HOME'] }}"
local_bin_path: "{{ target_home }}/.local/bin"
blueprint_config_dir: "{{ home }}/.config/blueprint"
blueprint_config_file: "{{ blueprint_config_dir }}/config.yaml"
blueprint_config_file_exists: "{{ lookup('fileglob', blueprint_config_file) | length > 0 }}"

dev_container: false

# become/sudo drops the caller's proxy variables, which breaks any network task
# on a proxied network. Re-export them explicitly where they are needed.
# Empty when no proxy is configured, in which case curl & friends ignore them.
proxy_env:
  http_proxy: "{{ lookup('env', 'http_proxy') }}"
  https_proxy: "{{ lookup('env', 'https_proxy') }}"
  no_proxy: "{{ lookup('env', 'no_proxy') }}"
  HTTP_PROXY: "{{ lookup('env', 'http_proxy') }}"
  HTTPS_PROXY: "{{ lookup('env', 'https_proxy') }}"
  NO_PROXY: "{{ lookup('env', 'no_proxy') }}"

# A single unreachable source makes apt fail the whole cache refresh, and some
# networks (e.g. filtering corporate proxies) block these hosts outright. Probe
# them first and drop the ones that cannot be fetched instead of failing every
# package task. They come back automatically on a network that allows them.
optional_apt_repos:
  - list: mullvad.list
    url: https://repository.mullvad.net/deb/stable/dists/stable/InRelease

common_pip_packages:
  - pip
  - docker
  - setuptools
  - pynacl
  - aiohttp
  - pipx
  - pyyaml
  - hcloud
  - pydo
  - azure-core
  - httpx
  - pandas
  - artifacts-keyring
  - pipx
  - pytest
  - pytest-cov
  - pytest-asyncio
  - pydantic
  - pydantic[email]
  - click
  - psycopg2-binary

common_pipx_packages:
  - cookiecutter
  - azure-cli
  - uv
  - ruff
  - pre-commit
  - mypy
  - ansible-lint
  - git-review # needed by Zuul
  - yamllint
  - pylint
  - podman-compose
  - yubikey-manager
  - black
  - coverage
  - poetry
  - sphinx
  - poethepoet
  - yt-dlp
  - llm
  - djlint

common_node_packages:
  - npm
  - prettier
  - nodemon
  - concurrently
  - tsx
  - bash-language-server
  - sass
  - wrangler
  - "@anthropic-ai/claude-code"
  - "@github/copilot"
  - "opencode-ai"
  - "azure-functions-core-tools@4"
  - "@earendil-works/pi-coding-agent"

common_git_repos:
  - url: ssh://git@github.com/evgnomon/usecode.git
    prefix: &prefix_home_src "{{ ansible_facts['env']['HOME'] }}/src"
