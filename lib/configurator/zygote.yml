---
- name: Set variables
  hosts: localhost
  gather_facts: true
  tasks:
    - name: Include setup variables
      include_tasks: "tasks/setup_vars.yaml"
  tags:
    - always

- name: Zygote role
  hosts: localhost
  roles:
    - role: terminal
  environment: "{{ proxy_env | combine({'PATH': custom_path}) }}"
