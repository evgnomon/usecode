---
- name: Install packages for Debian family
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Include pkg role for all packages
      with_items: "{{ pkg.charts }}"
      include_role:
        name: pkg
      loop_control:
        loop_var: package
      tags:
        - pkg
      when:
        - ansible_facts['os_family'] in pkg_versions.get(package.name, {}).get('os_families', [ansible_facts['os_family']])
        - pkg_versions.get(package.name, {}).get('dev_container', true) or not dev_container | default(false)

    - name: Include pkg role for Debian specific packages
      with_items: "{{ pkg_debian.charts }}"
      when:
        - ansible_facts['os_family'] in pkg_versions.get(package.name, {}).get('os_families', [ansible_facts['os_family']])
        - pkg_versions.get(package.name, {}).get('dev_container', true) or not dev_container | default(false)

      include_role:
        name: pkg
      loop_control:
        loop_var: package
      tags:
        - pkg

- name: Localhost roles for Debian family
  gather_facts: false
  hosts: localhost
  roles:
    - usecode
    - install_flow
    - terminal
    - bash_history_backup
    - vscode
    - docker
    - remove-gnome-packages
  environment:
    PATH: "{{ custom_path }}"
    LD_LIBRARY_PATH: "{{ ansible_facts['env']['HOME'] }}/.pyenv/versions/{{ python_version | default('3.14.3') }}/lib/"

- name: Localhost roles for Debian family (non-WSL2 only)
  gather_facts: false
  hosts: localhost
  tasks:
    - name: Run disable_ipv6 role
      include_role:
        name: disable_ipv6
      when: not wsl2_kernel | default(false)
    - name: Run packer role
      include_role:
        name: packer
      when: not wsl2_kernel | default(false)
    - name: Run llama-cpp role
      include_role:
        name: llama-cpp
      when: not wsl2_kernel | default(false)
  environment:
    PATH: "{{ custom_path }}"
    LD_LIBRARY_PATH: "{{ ansible_facts['env']['HOME'] }}/.pyenv/versions/{{ python_version | default('3.14.3') }}/lib/"

- name: Install ZLS language server
  gather_facts: false
  hosts: localhost
  roles:
    - ensure_zls
  environment:
    PATH: "{{ custom_path }}"
    LD_LIBRARY_PATH: "{{ ansible_facts['env']['HOME'] }}/.pyenv/versions/{{ python_version | default('3.14.3') }}/lib/"
  tags:
    - zls
