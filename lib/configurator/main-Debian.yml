---
- name: Install packages for Debian family
  hosts: localhost
  gather_facts: false
  environment: "{{ proxy_env }}"
  tasks:
    - name: Include pkg role for all packages
      with_items: "{{ pkg.charts }}"
      include_role:
        name: pkg
      loop_control:
        loop_var: package
      tags:
        - pkg
      when:
        - ansible_facts['os_family'] in pkg_versions.get(package.name, {}).get('os_families', [ansible_facts['os_family']])
        - package.get('dev_container', pkg_versions.get(package.name, {}).get('dev_container', true)) or installation_profile != 'dev_container'

    - name: Include pkg role for Debian specific packages
      with_items: "{{ pkg_debian.charts }}"
      when:
        - ansible_facts['os_family'] in pkg_versions.get(package.name, {}).get('os_families', [ansible_facts['os_family']])
        - package.get('dev_container', pkg_versions.get(package.name, {}).get('dev_container', true)) or installation_profile != 'dev_container'

      include_role:
        name: pkg
      loop_control:
        loop_var: package
      tags:
        - pkg

- name: Localhost roles for Debian family
  gather_facts: false
  hosts: localhost
  roles:
    - usecode
    - install_flow
    - apt
    - dotfiles
    - git
    - pam_sudo
    - role: sysctl
      when: installation_profile in ['workstation', 'vm']
    - role: udev_hwdb
      when: installation_profile in ['workstation', 'vm']
    - role: gnome
      when: installation_profile in ['workstation', 'vm']
    - { role: fonts, when: installation_profile == 'workstation' }
    - mise
    - role: bash_history_backup
      when: installation_profile not in ['dev_container', 'wsl']
    - { role: wslview, when: installation_profile == 'wsl' }
    - vscode
    - { role: docker, when: installation_profile != 'dev_container' }
  environment: "{{ proxy_env | combine({'PATH': custom_path, 'LD_LIBRARY_PATH': ansible_facts['env']['HOME'] ~ '/.pyenv/versions/' ~ (python_version | default('3.14.3')) ~ '/lib/'}) }}"

- name: Localhost roles for Debian family (non-WSL2 only)
  gather_facts: false
  hosts: localhost
  tasks:
    - name: Run packer role
      include_role:
        name: packer
      when: installation_profile != 'dev_container'
    - name: Run system-facts role
      include_role:
        name: system-facts
    - name: Run llama-cpp role
      include_role:
        name: llama-cpp
      when: installation_profile != 'dev_container'
  environment: "{{ proxy_env | combine({'PATH': custom_path, 'LD_LIBRARY_PATH': ansible_facts['env']['HOME'] ~ '/.pyenv/versions/' ~ (python_version | default('3.14.3')) ~ '/lib/'}) }}"

- name: Install ZLS language server
  gather_facts: false
  hosts: localhost
  roles:
    - ensure_zls
  environment: "{{ proxy_env | combine({'PATH': custom_path, 'LD_LIBRARY_PATH': ansible_facts['env']['HOME'] ~ '/.pyenv/versions/' ~ (python_version | default('3.14.3')) ~ '/lib/'}) }}"
  tags:
    - zls
