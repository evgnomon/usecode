---
- name: Install packages for Debian family
  hosts: localhost
  gather_facts: false
  environment: "{{ proxy_env }}"
  pre_tasks:
    # apt does not read http_proxy/https_proxy from the environment reliably,
    # so mirror the caller's proxy into apt's own config. Removed again when
    # the machine has no proxy, so a stale file can never break plain networks.
    - name: Configure apt proxy
      become: true
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/99proxy
        mode: "0644"
        content: |
          Acquire::http::Proxy "{{ proxy_env.http_proxy }}";
          Acquire::https::Proxy "{{ proxy_env.https_proxy | default(proxy_env.http_proxy, true) }}";
      when: proxy_env.http_proxy | length > 0
      tags:
        - always

    - name: Remove apt proxy config when no proxy is configured
      become: true
      ansible.builtin.file:
        path: /etc/apt/apt.conf.d/99proxy
        state: absent
      when: proxy_env.http_proxy | length == 0
      tags:
        - always

  tasks:
    - name: Include pkg role for all packages
      with_items: "{{ pkg.charts }}"
      include_role:
        name: pkg
      loop_control:
        loop_var: package
      tags:
        - pkg
      when:
        - ansible_facts['os_family'] in pkg_versions.get(package.name, {}).get('os_families', [ansible_facts['os_family']])
        - pkg_versions.get(package.name, {}).get('dev_container', true) or installation_profile != 'dev_container'

    - name: Include pkg role for Debian specific packages
      with_items: "{{ pkg_debian.charts }}"
      when:
        - ansible_facts['os_family'] in pkg_versions.get(package.name, {}).get('os_families', [ansible_facts['os_family']])
        - pkg_versions.get(package.name, {}).get('dev_container', true) or installation_profile != 'dev_container'

      include_role:
        name: pkg
      loop_control:
        loop_var: package
      tags:
        - pkg

- name: Localhost roles for Debian family
  gather_facts: false
  hosts: localhost
  roles:
    - usecode
    - install_flow
    - terminal
    - { role: bash_history_backup, when: installation_profile not in ['dev_container', 'wsl'] }
    - { role: wslview, when: installation_profile == 'wsl' }
    - vscode
    - { role: docker, when: installation_profile != 'dev_container' }
    - { role: remove-gnome-packages, when: installation_profile == 'workstation' }
  environment: "{{ proxy_env | combine({'PATH': custom_path, 'LD_LIBRARY_PATH': ansible_facts['env']['HOME'] ~ '/.pyenv/versions/' ~ (python_version | default('3.14.3')) ~ '/lib/'}) }}"

- name: Localhost roles for Debian family (non-WSL2 only)
  gather_facts: false
  hosts: localhost
  tasks:
    - name: Run disable_ipv6 role
      include_role:
        name: disable_ipv6
      when: installation_profile == 'workstation'
    - name: Run packer role
      include_role:
        name: packer
      when: installation_profile != 'dev_container'
    - name: Run system-facts role
      include_role:
        name: system-facts
    - name: Run llama-cpp role
      include_role:
        name: llama-cpp
      when: installation_profile != 'dev_container'
  environment: "{{ proxy_env | combine({'PATH': custom_path, 'LD_LIBRARY_PATH': ansible_facts['env']['HOME'] ~ '/.pyenv/versions/' ~ (python_version | default('3.14.3')) ~ '/lib/'}) }}"

- name: Install ZLS language server
  gather_facts: false
  hosts: localhost
  roles:
    - ensure_zls
  environment: "{{ proxy_env | combine({'PATH': custom_path, 'LD_LIBRARY_PATH': ansible_facts['env']['HOME'] ~ '/.pyenv/versions/' ~ (python_version | default('3.14.3')) ~ '/lib/'}) }}"
  tags:
    - zls
