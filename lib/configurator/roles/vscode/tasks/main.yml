---
# VS Code settings and the extension list are linked by the dotfiles role.
- name: Install VS Code extensions
  ansible.builtin.shell: xargs -L 1 code --install-extension < {{ ansible_facts['env']['HOME'] }}/.config/Code/extensions.txt
  args:
    executable: /bin/bash
  failed_when: false
  tags:
    - vscode
