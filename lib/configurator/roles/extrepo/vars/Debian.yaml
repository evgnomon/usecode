---
extrepo_repositories:
  - id: brave_release
    uri: https://brave-browser-apt-release.s3.brave.com
    legacy_paths:
      - /etc/apt/sources.list.d/brave-browser-release.sources
      - /etc/apt/trusted.gpg.d/brave-browser-release.gpg
  - id: docker-ce
    uri: https://download.docker.com/linux/debian
    legacy_paths:
      - /etc/apt/sources.list.d/docker.list
      - /etc/apt/keyrings/docker.asc
  - id: dotnet
    uri: "{{ ({'bookworm': 'https://packages.microsoft.com/debian/12/prod', 'trixie': 'https://packages.microsoft.com/debian/13/prod'}).get(ansible_facts['distribution_release'], 'https://packages.microsoft.com/debian/12/prod') }}"
    legacy_paths:
      - /etc/apt/sources.list.d/ms.list
      - /etc/apt/keyrings/microsoft-prod.gpg
      - /etc/apt/trusted.gpg.d/microsoft.gpg
  - id: vscode
    uri: https://packages.microsoft.com/repos/code
    legacy_paths:
      - /etc/apt/sources.list.d/vscode.sources
      - /etc/apt/keyrings/microsoft-prod.gpg
  - id: mullvad
    uri: https://repository.mullvad.net/deb/stable
    legacy_paths:
      - /etc/apt/sources.list.d/mullvad.list
      - /etc/apt/trusted.gpg.d/mullvad-keyring.gpg
  - id: mise
    package: mise
    uri: https://mise.jdx.dev/deb

# HashiCorp tools come from mise, so no HashiCorp Apt repository is used.
extrepo_disabled_repositories:
  - hashicorp

extrepo_retired_paths:
  - /etc/apt/sources.list.d/hashicorp.list
  - /etc/apt/keyrings/hashicorp-archive-keyring.gpg
  - /etc/apt/trusted.gpg.d/hashicorp-archive-keyring.gpg
