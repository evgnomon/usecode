---
- name: Ensure user fonts directory exists
  ansible.builtin.file:
    state: directory
    path: "{{ user_fonts_dir }}"
  tags:
    - fonts

- name: Install all TTF fonts from blueprint cache
  shell: |
    find {{ blueprint_home }} -name "*.ttf" -type f -exec cp {} "{{ user_fonts_dir }}" \;
  tags:
    - fonts

- name: Update font cache
  shell: fc-cache -f -v
  tags:
    - fonts
