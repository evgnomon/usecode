---
- name: Inflate template configs in user home
  include_role:
    name: inflate
  vars:
    target: "{{ blueprint_user_home }}"
  when: item.state == 'file'
  loop: "{{ query('community.general.filetree', '../templates/home') }}"
  tags:
    - dotfiles

- name: Inflate desktop template configs in user home
  include_role:
    name: inflate
  vars:
    target: "{{ blueprint_user_home }}"
  when:
    - item.state == 'file'
    - installation_profile != 'dev_container'
  loop: "{{ query('community.general.filetree', '../templates/desktop') }}"
  tags:
    - dotfiles

- name: Inflate bashrc.d templates in root home
  include_role:
    name: inflate
  vars:
    target: /root
  when:
    - item.state == 'file'
    - item.path is match('.bashrc.d/')
  loop: "{{ query('community.general.filetree', '../templates/home') }}"
  tags:
    - dotfiles

- name: Ensure ~/.bashrc.d directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.bashrc.d"
    state: directory
    mode: '0755'
  tags:
    - dotfiles

- name: Ensure /root/.bashrc.d directory exists
  become: true
  ansible.builtin.file:
    path: /root/.bashrc.d
    state: directory
    mode: '0755'
  tags:
    - dotfiles

- name: Ensure parent directories exist for dotfiles
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/{{ _dst | dirname }}"
    state: directory
  vars:
    _parts: "{{ item.split(':') }}"
    _dst: "{{ _parts[1] | default(_parts[0]) }}"
  loop: "{{ dotfiles }}"
  when: _dst | dirname | length > 0
  tags:
    - dotfiles

- name: Link dotfiles
  ansible.builtin.file:
    src: "{{ role_path }}/files/{{ _src }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/{{ _dst }}"
    state: link
    force: true
  vars:
    _parts: "{{ item.split(':') }}"
    _src: "{{ _parts[0] }}"
    _dst: "{{ _parts[1] | default(_parts[0]) }}"
  loop: "{{ dotfiles }}"
  tags:
    - dotfiles

- name: Link dotfiles for root
  become: true
  ansible.builtin.file:
    src: "{{ role_path }}/files/{{ item }}"
    dest: "/root/{{ item }}"
    state: link
    force: true
  loop: "{{ root_dotfiles }}"
  tags:
    - dotfiles

- name: Ensure parent directories exist for dotdirs
  ansible.builtin.file:
    path: "{{ _dotdir_dest | dirname }}"
    state: directory
  vars:
    _home: "{{ ansible_facts['env']['HOME'] }}"
    _dotdir_dest: "{{ item.dest if item.dest.startswith('/') else _home + '/' + item.dest }}"
  loop: "{{ dotdirs | default([]) }}"
  tags:
    - dotfiles

- name: Link dotdirs
  ansible.builtin.file:
    src: "{{ _dotdir_src }}"
    dest: "{{ _dotdir_dest }}"
    state: link
    force: true
  vars:
    _home: "{{ ansible_facts['env']['HOME'] }}"
    _dotdir_src: "{{ item.src if item.src.startswith('/') else _home + '/' + item.src }}"
    _dotdir_dest: "{{ item.dest if item.dest.startswith('/') else _home + '/' + item.dest }}"
  loop: "{{ dotdirs | default([]) }}"
  tags:
    - dotfiles

- name: Restrict gnupg directory permissions
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.gnupg"
    mode: '0700'
  tags:
    - dotfiles
