---
- name: Install sysctl configuration
  become: true
  ansible.builtin.template:
    src: sysctl.conf.j2
    dest: /etc/sysctl.conf
    mode: '0644'
  notify: Apply sysctl settings
  tags:
    - sysctl

- name: Install IPv6 disable sysctl configuration
  become: true
  ansible.builtin.copy:
    src: 99-disable-ipv6.conf
    dest: /etc/sysctl.d/99-disable-ipv6.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
  when: installation_profile == 'workstation'
  notify: Apply sysctl settings
  tags:
    - sysctl
