---
- name: Check profile picture exists
  stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh/.face"
  register: face_file_stat
  tags:
    - gnome

- name: Set Gnome avatar
  shell: cp {{ ansible_facts['env']['HOME'] }}/.ssh/.face {{ ansible_facts['env']['HOME'] }}/.face
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.face"
  when: face_file_stat.stat.exists
  tags:
    - gnome

- name: List gsettings schemas
  command: gsettings list-schemas
  register: gsettings_schemas
  failed_when: false
  changed_when: false
  tags:
    - gnome

- name: Set app switcher to current workspace only
  command: gsettings set org.gnome.shell.app-switcher current-workspace-only true
  when:
    - gsettings_schemas.rc | default(1) == 0
    - "'org.gnome.shell.app-switcher' in gsettings_schemas.stdout | default('')"
  tags:
    - gnome

- name: Remove GNOME games and applications
  include_tasks: remove_packages.yaml
  when: installation_profile == 'workstation'
  tags:
    - gnome
