---
pkg_templates_debian:
  idea:
    os: &pkg_templates_idea_os >-
      {{
        {
          'Debian': 'tar.gz',
        }[ansible_facts['os_family']] | default('')
      }}
    arch: &pkg_templates_idea_arch >-
      {{
        {
          'x86_64': '',
          'aarch64': '-aarch64'
        }[ansible_facts['architecture']] | default('')
      }}

pkg_debian:
  charts:
    - name: idea
      version: "{{ pkg_versions.idea.version }}"
      template: &template_idea
        os: *pkg_templates_idea_os
        arch: *pkg_templates_idea_arch
        url: https://download.jetbrains.com/%(name)s/%(name)sIC-%(version)s{{ pkg_templates_debian.idea.arch }}.{{ pkg_templates_debian.idea.os }}
        ext: &ext_targz tar.gz
        inflate: &inflate_targz tar -C %(dest)s -xzvf %(src)s
        creates: idea-IC-{{ pkg_versions.idea.version_full }}/bin/idea
      bins:
        - name: idea
          src: &bins_idea_src idea-IC-{{ pkg_versions.idea.version_full }}/bin/idea
    - name: rider
      version: "{{ pkg_versions.rider.version }}"
      template: &template_rider
        os: *pkg_templates_idea_os
        arch: *pkg_templates_idea_arch
        url: https://download.jetbrains.com/%(name)s/JetBrains.Rider-%(version)s.tar.gz
        ext: *ext_targz
        inflate: *inflate_targz
        creates: "JetBrains Rider-{{ pkg_versions.rider.version }}/bin/rider"
      bins:
        - name: rider
          src: &bins_rider_src "JetBrains Rider-{{ pkg_versions.rider.version }}/bin/rider"
