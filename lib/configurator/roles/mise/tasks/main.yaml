---
# The mise Apt repository is enabled by the extrepo role.
- name: Install mise
  become: true
  ansible.builtin.apt:
    name: mise
    state: present
  tags:
    - mise

- name: Check global mise tools
  ansible.builtin.command:
    argv:
      - mise
      - use
      - --global
      - --dry-run-code
      - "{{ item }}"
  register: mise_global_tools_check
  changed_when: false
  failed_when: mise_global_tools_check.rc not in [0, 1]
  loop: "{{ mise_global_tools }}"
  tags:
    - mise

- name: Install global mise tools
  ansible.builtin.command:
    argv:
      - mise
      - --yes
      - use
      - --global
      - "{{ item.item }}"
  loop: "{{ mise_global_tools_check.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc == 1
  tags:
    - mise
