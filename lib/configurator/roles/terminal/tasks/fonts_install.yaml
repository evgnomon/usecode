---
- file:
    state: directory
    path: "{{ user_fonts_dir }}"
  when: installation_profile == 'workstation'
  tags:
    - fonts

- name: Install all TTF fonts from blueprint cache
  shell: |
    find {{ blueprint_home }} -name "*.ttf" -type f -exec cp {} "{{ user_fonts_dir }}" \;
  tags:
    - fonts

- name: Update GNOME font cache
  shell: fc-cache -f -v
  when:
    - ansible_facts['os_family'] == "Debian"
    - installation_profile == 'workstation'
    - installation_profile == 'workstation'
  tags:
    - fonts
