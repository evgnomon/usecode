- name: Install Microsoft 2025 GPG key
  become: true
  environment: "{{ proxy_env }}"
  shell: |
    install -d -m 0755 /etc/apt/keyrings
    curl -fsSL https://packages.microsoft.com/keys/microsoft-2025.asc -o /etc/apt/keyrings/microsoft-2025.asc
  args:
    creates: /etc/apt/keyrings/microsoft-2025.asc
  tags:
    - always

- name: Install Microsoft GPG key
  become: true
  environment: "{{ proxy_env }}"
  shell: |
    curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /etc/apt/trusted.gpg.d/microsoft.gpg
  args:
    creates: /etc/apt/trusted.gpg.d/microsoft.gpg
  tags:
    - always

- name: Remove duplicate dotnetdev.list
  become: true
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/dotnetdev.list
    state: absent
  tags:
    - always

- name: Remove packages-microsoft-prod.list
  become: true
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/packages-microsoft-prod.list
    state: absent
  tags:
    - always

- name: Remove stale microsoft-ubuntu-resolute-prod.list
  become: true
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/microsoft-ubuntu-resolute-prod.list
    state: absent
  tags:
    - always

- name: Configure Azure CLI repository
  become: true
  ansible.builtin.copy:
    content: "deb [arch=amd64 signed-by=/etc/apt/trusted.gpg.d/microsoft.gpg] https://packages.microsoft.com/repos/azure-cli/ noble main\n"
    dest: /etc/apt/sources.list.d/azure.list
  tags:
    - always

- name: Install Microsoft VS Code Repository
  become: true
  environment: "{{ proxy_env }}"
  shell: |
    curl -sSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > /etc/apt/trusted.gpg.d/vscode.gpg
    echo "deb [arch=amd64] https://packages.microsoft.com/repos/code stable main" > /etc/apt/sources.list.d/vscode.list
  args:
    creates: /etc/apt/sources.list.d/vscode.list
  tags:
    - always
