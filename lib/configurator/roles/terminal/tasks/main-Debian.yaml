- name: Install extrepo
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name: extrepo
    state: present
  tags:
    - always

- name: Enable extrepo non-free policy
  become: true
  ansible.builtin.replace:
    path: /etc/extrepo/config.yaml
    regexp: '^# - non-free$'
    replace: '- non-free'
  tags:
    - always

- name: Enable supported third-party repositories with extrepo
  become: true
  ansible.builtin.command:
    argv:
      - extrepo
      - enable
      - "{{ item.id }}"
  register: terminal_extrepo_enable
  failed_when: >-
    terminal_extrepo_enable.rc != 0 and
    'does not exist' not in
    ((terminal_extrepo_enable.stdout | default('')) ~ (terminal_extrepo_enable.stderr | default('')))
  changed_when: >-
    terminal_extrepo_enable.rc == 0 and
    'already existed' not in (terminal_extrepo_enable.stdout | default(''))
  loop: "{{ terminal_extrepo_repositories }}"
  loop_control:
    label: "{{ item.id }}"
  tags:
    - always

- name: Record enabled extrepo repositories
  ansible.builtin.set_fact:
    terminal_extrepo_enabled_repo_ids: >-
      {{
        terminal_extrepo_enable.results
        | selectattr('rc', 'defined')
        | selectattr('rc', 'eq', 0)
        | map(attribute='item.id')
        | list
      }}
    terminal_extrepo_packages: >-
      {{
        terminal_extrepo_enable.results
        | selectattr('rc', 'defined')
        | selectattr('rc', 'eq', 0)
        | selectattr('item.package', 'defined')
        | map(attribute='item.package')
        | list
      }}
  tags:
    - always

- name: Remove legacy Apt repository files replaced by extrepo
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{
      terminal_extrepo_enable.results
      | selectattr('rc', 'defined')
      | selectattr('rc', 'eq', 0)
      | map(attribute='item.legacy_paths')
      | select('defined')
      | flatten
    }}
  when: terminal_extrepo_enable is defined
  tags:
    - always

- name: Install extrepo-managed packages
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name: "{{ terminal_extrepo_packages }}"
    state: present
  when: terminal_extrepo_packages | default([]) | length > 0
  tags:
    - apt

- name: Ensure Microsoft Apt keyring directory exists
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  tags:
    always

- name: Install Microsoft Apt keyring
  become: true
  ansible.builtin.copy:
    src: "{{ role_path }}/templates/Debian/etc/apt/keyrings/microsoft-prod.gpg"
    dest: /etc/apt/keyrings/microsoft-prod.gpg
    mode: "0644"
  tags:
    always

- name: Remove legacy Microsoft Apt keyring
  become: true
  ansible.builtin.file:
    path: /etc/apt/trusted.gpg.d/microsoft.gpg
    state: absent
  tags:
    always

- name: Check HashiCorp Apt keyring
  become: true
  ansible.builtin.stat:
    path: /etc/apt/keyrings/hashicorp-archive-keyring.gpg
  register: terminal_hashicorp_keyring
  tags:
    - always

- name: Remove legacy HashiCorp Apt keyring
  become: true
  ansible.builtin.file:
    path: /etc/apt/trusted.gpg.d/hashicorp-archive-keyring.gpg
    state: absent
  when: terminal_hashicorp_keyring.stat.exists | default(false)
  tags:
    - always
