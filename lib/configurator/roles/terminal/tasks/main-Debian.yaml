- name: Install extrepo
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name: extrepo
    state: present
  tags:
    - always

- name: Install extrepo config
  become: true
  ansible.builtin.template:
    src: "{{ role_path }}/templates/Debian/etc/extrepo/config.yaml.j2"
    dest: /etc/extrepo/config.yaml
    mode: "0644"
  register: terminal_extrepo_config_policy
  tags:
    - always

- name: Discover existing extrepo source files
  become: true
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: 'extrepo_*.sources'
    file_type: file
    contains: "{{ item.uri }}"
    read_whole_file: true
  register: terminal_extrepo_existing_source_files
  loop: "{{ terminal_extrepo_repositories }}"
  loop_control:
    label: "{{ item.id }}"
  tags:
    - always

- name: Enable supported third-party repositories with extrepo
  become: true
  ansible.builtin.command:
    argv:
      - extrepo
      - enable
      - "{{ item.id }}"
  register: terminal_extrepo_enable
  changed_when: >-
    terminal_extrepo_enable.rc == 0 and
    (
      terminal_extrepo_existing_source_files.results[extrepo_repo_index].matched == 0 or
      'already existed' not in
      ((terminal_extrepo_enable.stdout | default('')) ~ (terminal_extrepo_enable.stderr | default('')))
    )
  loop: "{{ terminal_extrepo_repositories }}"
  loop_control:
    label: "{{ item.id }}"
    index_var: extrepo_repo_index
  tags:
    - always

- name: Discover active extrepo source files
  become: true
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: 'extrepo_*.sources'
    file_type: file
    contains: "{{ item.uri }}"
    read_whole_file: true
  register: terminal_extrepo_source_files
  loop: "{{ terminal_extrepo_repositories }}"
  loop_control:
    label: "{{ item.id }}"
  tags:
    - always

- name: Record active extrepo repositories
  vars:
    terminal_extrepo_newly_enabled_repo_ids: >-
      {%- set repository_ids = [] -%}
      {%- for result in terminal_extrepo_source_files.results -%}
      {%- if result.matched | default(0) > 0 and terminal_extrepo_existing_source_files.results[loop.index0].matched | default(0) == 0 -%}
      {%- set _ = repository_ids.append(result.item.id) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ repository_ids }}
  ansible.builtin.set_fact:
    terminal_extrepo_successful_repositories: >-
      {{
        terminal_extrepo_source_files.results
        | selectattr('matched', 'defined')
        | selectattr('matched', 'gt', 0)
        | map(attribute='item')
        | list
      }}
    terminal_extrepo_newly_enabled_repo_ids: "{{ terminal_extrepo_newly_enabled_repo_ids }}"
  tags:
    - always

- name: Assert configured extrepo repositories resolved
  vars:
    terminal_extrepo_required_repo_ids: >-
      {{
        terminal_extrepo_repositories
        | rejectattr('required', 'defined')
        | map(attribute='id')
        | list
        + (
          terminal_extrepo_repositories
          | selectattr('required', 'defined')
          | selectattr('required')
          | map(attribute='id')
          | list
        )
      }}
    terminal_extrepo_failed_repo_ids: >-
      {{
        terminal_extrepo_enable.results
        | selectattr('rc', 'defined')
        | rejectattr('rc', 'eq', 0)
        | map(attribute='item.id')
        | select('in', terminal_extrepo_required_repo_ids)
        | list
      }}
    terminal_extrepo_missing_repo_ids: >-
      {{
        terminal_extrepo_required_repo_ids
        | difference(terminal_extrepo_successful_repositories | map(attribute='id') | list)
      }}
  ansible.builtin.assert:
    that:
      - terminal_extrepo_failed_repo_ids | length == 0
      - terminal_extrepo_missing_repo_ids | length == 0
    fail_msg: >-
      extrepo failed for: {{ terminal_extrepo_failed_repo_ids | join(', ') }};
      missing source files for: {{ terminal_extrepo_missing_repo_ids | join(', ') }}
  tags:
    - always

- name: Derive enabled extrepo repository metadata
  ansible.builtin.set_fact:
    terminal_extrepo_enabled_repo_ids: "{{ terminal_extrepo_successful_repositories | map(attribute='id') | list }}"
    terminal_extrepo_packages: >-
      {{
        terminal_extrepo_successful_repositories
        | selectattr('package', 'defined')
        | map(attribute='package')
        | list
      }}
  tags:
    - always

- name: Remove legacy Apt repository files replaced by extrepo
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  register: terminal_extrepo_legacy_cleanup
  loop: >-
    {{
      terminal_extrepo_successful_repositories
      | selectattr('legacy_paths', 'defined')
      | map(attribute='legacy_paths')
      | flatten
    }}
  when: terminal_extrepo_successful_repositories | default([]) | length > 0
  tags:
    - always

- name: Refresh Apt cache after enabling extrepo repositories
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 0
  when:
    - >
      terminal_extrepo_config_policy.changed or
      (terminal_extrepo_enable.results | selectattr('changed') | list | length > 0) or
      (terminal_extrepo_newly_enabled_repo_ids | default([]) | length > 0) or
      (terminal_extrepo_legacy_cleanup.results | default([]) | selectattr('changed') | list | length > 0)
  tags:
    - always

- name: Install extrepo-managed packages
  become: true
  ansible.builtin.apt:
    name: "{{ terminal_extrepo_packages }}"
    state: present
  when: terminal_extrepo_packages | default([]) | length > 0
  tags:
    - apt

- name: Ensure Microsoft Apt keyring directory exists
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  tags:
    always

- name: Install Microsoft Apt keyring
  become: true
  ansible.builtin.copy:
    src: "{{ role_path }}/templates/Debian/etc/apt/keyrings/microsoft-prod.gpg"
    dest: /etc/apt/keyrings/microsoft-prod.gpg
    mode: "0644"
  tags:
    always

- name: Remove legacy Microsoft Apt keyring
  become: true
  ansible.builtin.file:
    path: /etc/apt/trusted.gpg.d/microsoft.gpg
    state: absent
  tags:
    always

- name: Check HashiCorp Apt keyring
  become: true
  ansible.builtin.stat:
    path: /etc/apt/keyrings/hashicorp-archive-keyring.gpg
  register: terminal_hashicorp_keyring
  tags:
    - always

- name: Remove legacy HashiCorp Apt keyring
  become: true
  ansible.builtin.file:
    path: /etc/apt/trusted.gpg.d/hashicorp-archive-keyring.gpg
    state: absent
  when: terminal_hashicorp_keyring.stat.exists | default(false)
  tags:
    - always
