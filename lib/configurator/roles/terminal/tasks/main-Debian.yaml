- name: Refresh HashiCorp Apt signing key
  become: true
  environment: "{{ proxy_env }}"
  shell: |
    set -euo pipefail
    install -d -m 0755 /etc/apt/trusted.gpg.d
    tmp_key="$(mktemp)"
    trap 'rm -f "$tmp_key"' EXIT
    curl -fsSL https://apt.releases.hashicorp.com/gpg | gpg --dearmor --batch --yes -o "$tmp_key"
    if ! cmp -s "$tmp_key" /etc/apt/trusted.gpg.d/hashicorp-archive-keyring.gpg; then
      install -m 0644 "$tmp_key" /etc/apt/trusted.gpg.d/hashicorp-archive-keyring.gpg
      echo changed
    fi
  args:
    executable: /bin/bash
  register: terminal_hashicorp_key_refresh
  changed_when: "'changed' in terminal_hashicorp_key_refresh.stdout"
  tags:
    - always

- name: Install Microsoft Repo
  become: true
  shell: |
    curl https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > /etc/apt/trusted.gpg.d/microsoft.gpg
  tags:
    always
