---
- file:
    state: directory
    path: "{{ target }}/{{ item.path | replace('.j2', '') | dirname }}"
  become: "{{ (target in ['/etc', '/root']) | bool }}"
  tags:
    - always

- template:
    src: "{{ item.src }}"
    dest: "{{ target }}/{{ item.path | replace('.j2', '') }}"
    mode: "{{ '0755' if (item.path | dirname) is search('(^|/)bin$') else omit }}"
  become: "{{ (target in ['/etc', '/root']) | bool }}"
  when:
    - item.path[-3:] == '.j2'
  tags:
    - always

- copy:
    src: "{{ item.src }}"
    dest: "{{ target }}/{{ item.path }}"
    mode: "{{ '0755' if (item.path | dirname) is search('(^|/)bin$') else omit }}"
  become: "{{ (target in ['/etc', '/root']) | bool }}"
  when:
    - item.path[-3:] != '.j2'
  tags:
    - always
