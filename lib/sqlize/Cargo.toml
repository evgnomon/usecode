[package]
name = "sqlize"
version = "0.1.0"
edition.workspace = true
description = "Apply SQL migration files from a directory to SQLite or PostgreSQL"
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "sqlize"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
postgres.workspace = true
rusqlite = { version = "0.39", features = ["bundled"] }
