[package]
name = "sqlize"
version = "0.1.0"
edition = "2024"
description = "Apply SQL migration files from a directory to SQLite or PostgreSQL"
license = "HGL"
authors = ["Hamed Ghasemzadeh <hg@evgnomon.org>"]
publish = false

[[bin]]
name = "sqlize"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
postgres = "0.19"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
