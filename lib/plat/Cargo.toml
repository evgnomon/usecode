[package]
name = "plat"
version = "0.1.0"
edition = "2024"
description = "Per-host service deployment driver dispatching to blueprint plat scripts"
license = "HGL"
authors = ["Hamed Ghasemzadeh <hg@evgnomon.org>"]
publish = false

[[bin]]
name = "plat"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
regex = "1.13.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
