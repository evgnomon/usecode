[package]
name = "tm"
version = "0.1.0"
edition.workspace = true
description = "Browser-style windows, tabs and splits in the terminal, on top of tmux"
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "uc-terminal-tm"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive"] }
