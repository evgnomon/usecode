[package]
name = "secd"
version = "0.1.0"
edition = "2024"
description = "Secret manager with SSH ed25519 pubkey auth and vault-encrypted storage (CLI + HTTP server)"
license = "HGL"
authors = ["Hamed Ghasemzadeh <hg@evgnomon.org>"]
publish = false

[[bin]]
name = "secd"
path = "src/main.rs"

[dependencies]
aes = "0.8"
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
ctr = "0.9"
ed25519-dalek = "2"
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
ssh-key = { version = "0.6", features = ["ed25519"] }
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
