---
# handlers file for roles/llama-cpp

- name: Run ldconfig
  ansible.builtin.command: ldconfig
  changed_when: false

- name: Restart llama-server
  ansible.builtin.systemd:
    name: llama-server
    state: restarted
    daemon_reload: true
  when: llama_cpp_server_enabled
