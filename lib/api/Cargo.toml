[package]
name = "usecode-agent-api"
version = "0.1.0"
edition.workspace = true
description = "HTTP backend for usecode agent: OTP auth, API keys, cloud servers, tasks and the chat UI"
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "uc-agent-api"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["macros"] }
base64 = "0.22"
blake2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
dotenvy.workspace = true
fernet = { version = "0.2", default-features = false, features = ["rustcrypto"] }
futures = "0.3"
minijinja.workspace = true
rand = "0.9"
reqwest = { workspace = true, features = ["json", "query", "rustls", "charset", "http2"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "json", "derive"] }
subtle = "2"
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "signal", "time", "fs"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { workspace = true, features = ["v4", "serde"] }
