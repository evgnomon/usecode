[project]
name = "usecode-agent-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hamed Ghasemzadeh", email = "hg@evgnomon.org" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
    "uvicorn[standard]>=0.51.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.20",
    "asyncpg>=0.30.0",
    "sqlmodel>=0.0.39",
    "alembic>=1.19.1",
    "cryptography>=44.0.0",
]

[project.scripts]
usecode-agent-api = "usecode_agent_api:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = []
