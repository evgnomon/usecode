version: "3.9"

services:
  jitsi-web:
    image: docker.io/jitsi/web:stable
    container_name: ${TENANT}_${NAMESPACE}_${POD}_jitsi
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://${DOMAIN}:${PUBLIC_PORT:-443}
      TZ: UTC
      ENABLE_AUTH: "0"
      # TLS is terminated by Caddy; the web container must not try to do HTTPS
      # itself or redirect to it, otherwise the /xmpp-websocket upgrade request
      # gets a 301 and the browser reports "Websocket closed unexpectedly".
      DISABLE_HTTPS: "1"
      ENABLE_HTTP_REDIRECT: "0"
      ENABLE_XMPP_WEBSOCKET: "1"
      ENABLE_COLIBRI_WEBSOCKET: "1"
      XMPP_SERVER: ${TENANT}_${NAMESPACE}_${POD}_jitsi_prosody
      XMPP_BOSH_URL_BASE: http://${TENANT}_${NAMESPACE}_${POD}_jitsi_prosody:5280
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_GUEST_DOMAIN: guest.meet.jitsi
      XMPP_RECORDER_DOMAIN: recorder.meet.jitsi
      JVB_BREWERY_MUC: jvbbrewery
      JVB_WS_SERVER_ID: jvb
    ports:
      - "127.0.0.1:${PORT:-8443}:80"
    depends_on:
      - prosody
    volumes:
      - /mnt/z/volumes/${TENANT}/${NAMESPACE}/${POD}/jitsi_web_config:/config
    networks:
      - z-${TENANT}-${NAMESPACE}-${POD}
      - z-${TENANT}

  prosody:
    image: docker.io/jitsi/prosody:stable
    container_name: ${TENANT}_${NAMESPACE}_${POD}_jitsi_prosody
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://${DOMAIN}:${PUBLIC_PORT:-443}
      TZ: UTC
      ENABLE_AUTH: "0"
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      XMPP_GUEST_DOMAIN: guest.meet.jitsi
      XMPP_RECORDER_DOMAIN: recorder.meet.jitsi
      JVB_BREWERY_MUC: jvbbrewery
      JVB_AUTH_USER: jvb
      JVB_AUTH_PASSWORD: ${JVB_AUTH_PASSWORD:-changeme_jvb_secret}
      JICOFO_AUTH_USER: focus
      JICOFO_AUTH_PASSWORD: ${JICOFO_AUTH_PASSWORD:-changeme_jicofo_secret}
      JICOFO_COMPONENT_SECRET: ${JICOFO_COMPONENT_SECRET:-changeme_jicofo_component_secret}
    volumes:
      - /mnt/z/volumes/${TENANT}/${NAMESPACE}/${POD}/jitsi_prosody_config:/config
      - /mnt/z/volumes/${TENANT}/${NAMESPACE}/${POD}/jitsi_prosody_plugins:/prosody-plugins-custom
    networks:
      - z-${TENANT}-${NAMESPACE}-${POD}
      - z-${TENANT}

  jicofo:
    image: docker.io/jitsi/jicofo:stable
    container_name: ${TENANT}_${NAMESPACE}_${POD}_jitsi_jicofo
    restart: unless-stopped
    environment:
      TZ: UTC
      XMPP_SERVER: ${TENANT}_${NAMESPACE}_${POD}_jitsi_prosody
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_MUC_DOMAIN: muc.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      JVB_BREWERY_MUC: jvbbrewery
      JICOFO_AUTH_USER: focus
      JICOFO_AUTH_PASSWORD: ${JICOFO_AUTH_PASSWORD:-changeme_jicofo_secret}
      JICOFO_COMPONENT_SECRET: ${JICOFO_COMPONENT_SECRET:-changeme_jicofo_component_secret}
    depends_on:
      - prosody
    volumes:
      - /mnt/z/volumes/${TENANT}/${NAMESPACE}/${POD}/jitsi_jicofo_config:/config
    networks:
      - z-${TENANT}-${NAMESPACE}-${POD}
      - z-${TENANT}

  jvb:
    image: docker.io/jitsi/jvb:stable
    container_name: ${TENANT}_${NAMESPACE}_${POD}_jitsi_jvb
    restart: unless-stopped
    environment:
      TZ: UTC
      XMPP_SERVER: ${TENANT}_${NAMESPACE}_${POD}_jitsi_prosody
      XMPP_DOMAIN: meet.jitsi
      XMPP_AUTH_DOMAIN: auth.meet.jitsi
      XMPP_INTERNAL_MUC_DOMAIN: internal-muc.meet.jitsi
      JVB_BREWERY_MUC: jvbbrewery
      JVB_WS_SERVER_ID: jvb
      JVB_AUTH_USER: jvb
      JVB_AUTH_PASSWORD: ${JVB_AUTH_PASSWORD:-changeme_jvb_secret}
    depends_on:
      - prosody
    ports:
      - "127.0.0.1:${JVB_PORT:-10000}:10000/udp"
    volumes:
      - /mnt/z/volumes/${TENANT}/${NAMESPACE}/${POD}/jitsi_jvb_config:/config
    networks:
      - z-${TENANT}-${NAMESPACE}-${POD}
      - z-${TENANT}

networks:
  z-${TENANT}-${NAMESPACE}-${POD}:
    external: true
  z-${TENANT}:
    external: true
