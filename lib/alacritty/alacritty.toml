# Fullscreen (maximized on Windows) Gruvbox, CaskaydiaMono and a tmux "main" session as the shell.
# The colors are in themes/; `uc sync` links the one `theme` in config.yaml names (dark unless light).

[general]
# The theme `uc sync` picks, then local overrides that should not live in the repo.
import = ["~/.config/alacritty/theme.toml", "~/.config/alacritty/local.toml"]

[env]
TERM = "xterm-256color"

[terminal]
shell = { program = "/bin/bash", args = ["--login", "-c", "tmux new-session -A -s main"] }

[window]
startup_mode = "Fullscreen"
padding = { x = 10, y = 0 }

[scrolling]
history = 10000

[font]
size = 14
normal = { family = "CaskaydiaMono NFM", style = "Regular" }
bold = { family = "CaskaydiaMono NFM", style = "Bold" }
italic = { family = "CaskaydiaMono NFM", style = "Italic" }
bold_italic = { family = "CaskaydiaMono NFM", style = "Bold Italic" }

[selection]
# Selecting with the left mouse button copies to the clipboard too.
save_to_clipboard = true

[cursor]
style = { shape = "Block", blinking = "Never" }

[bell]
duration = 0

[keyboard]
bindings = [
    { key = "C", mods = "Control|Shift", action = "Copy" },
    { key = "V", mods = "Control|Shift", action = "Paste" },
]
