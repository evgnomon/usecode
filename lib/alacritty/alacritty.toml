# Fullscreen Gruvbox Dark, CaskaydiaMono and a tmux "main" session as the shell.

[general]
# Local overrides that should not live in the repo.
import = ["~/.config/alacritty/local.toml"]

[env]
TERM = "xterm-256color"

[terminal]
shell = { program = "/bin/bash", args = ["--login", "-c", "tmux new-session -A -s main"] }

[window]
startup_mode = "Fullscreen"
padding = { x = 10, y = 0 }

[scrolling]
history = 10000

[font]
size = 14
normal = { family = "CaskaydiaMono NFM", style = "Regular" }
bold = { family = "CaskaydiaMono NFM", style = "Bold" }
italic = { family = "CaskaydiaMono NFM", style = "Italic" }
bold_italic = { family = "CaskaydiaMono NFM", style = "Bold Italic" }

[cursor]
style = { shape = "Block", blinking = "Never" }

[bell]
duration = 0

[keyboard]
bindings = [
    { key = "C", mods = "Control|Shift", action = "Copy" },
    { key = "V", mods = "Control|Shift", action = "Paste" },
]

# Gruvbox Dark
[colors.primary]
background = "#282828"
foreground = "#ebdbb2"

[colors.cursor]
text = "#282828"
cursor = "#ebdbb2"

[colors.selection]
text = "#282828"
background = "#fabd2f"

[colors.normal]
black = "#282828"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"

[colors.bright]
black = "#928374"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
magenta = "#d3869b"
cyan = "#8ec07c"
white = "#ebdbb2"
