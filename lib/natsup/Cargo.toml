[package]
name = "natsup"
version = "0.1.0"
edition = "2024"
description = "Run NATS JetStream nodes and clusters with Podman"
license = "HGL"
authors = ["Hamed Ghasemzadeh <hg@evgnomon.org>"]
publish = false

[[bin]]
name = "natsup"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
