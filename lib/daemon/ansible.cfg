[defaults]
# Only ansible-vault reads this: uc net mesh add and apply run it from this
# directory to keep the inventory's WireGuard keys encrypted, and it only
# reads ansible.cfg from the current directory.
# The inventory is your own config, kept out of the checkout.
inventory = ~/.config/usecode/inventory

# vault-pass.sh is executable, so ansible-vault runs it and takes the
# password from its stdout - the password itself is never on disk here.
# Relative to the repo root, so it resolves for `uc net mesh add` too.
vault_password_file = deploy/vault-pass.sh
