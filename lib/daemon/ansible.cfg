[defaults]
# uc net mesh add and apply read this (the way ansible-vault would, run from
# this directory) to find the password for the inventory's vaulted
# WireGuard keys; `ansible-vault edit` run here finds it the same way.
# The inventory is your own config, kept out of the checkout.
inventory = ~/.config/usecode/inventory

# vault-pass.sh is executable, so it is run and the password taken from
# its stdout - the password itself is never on disk here. Relative to
# this file, so it resolves the same for `uc net mesh add` and ansible.
vault_password_file = deploy/vault-pass.sh
