---
# The usecode mesh: who is in it.
#
# This file, group_vars/usecode/ and host_vars/ together are the mesh
# topology - the one place that decides which hosts exist and what
# address each one holds. Nothing is decided on a host itself, which is
# what keeps two hosts from ever being handed the same tunnel address.
#
# `uc daemon install NAME` adds a host here with just the daemon and the
# mesh off (host_vars/NAME.yml says only how to reach it).
#
# Add members with `uc net mesh add NAME` from a checkout of this repo; it
# appends the host below, writes host_vars/NAME.yml with the address it
# allocated and the public key it minted, and puts the private key in
# group_vars/usecode/secrets.yml (ansible-vault). Then hand every
# member the topology with:
#
#   uc net mesh apply
all:
  children:
    usecode:
      hosts:
        shadow: {}
        hameds-desktop: {}
        worker-2: {}
