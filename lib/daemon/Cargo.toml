[package]
name = "uc-daemon"
version = "0.1.0"
edition.workspace = true
description = "WireGuard mesh + DNAT port forwarding manager"
license.workspace = true
publish = false

[lib]
name = "uc_daemon"
path = "src/lib.rs"

[[bin]]
name = "uc-net-mesh"
path = "src/main.rs"

[[bin]]
name = "uc-net-firewall"
path = "src/bin/uc-net-firewall.rs"

[[bin]]
name = "usecoded"
path = "src/bin/usecoded.rs"

[[bin]]
name = "uc-daemon-ctl"
path = "src/bin/uc-daemon-ctl.rs"

[dependencies]
base64 = "0.23"
libc.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_yaml.workspace = true
tempfile.workspace = true
toml.workspace = true
x25519-dalek = { version = "3", features = ["static_secrets"] }
