[package]
name = "pg"
version = "0.1.0"
edition.workspace = true
description = "PostgreSQL CLI for local podman instances, schema management and queries"
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "uc-db-pg"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
clap = { workspace = true, features = ["derive"] }
flate2 = "1"
postgres = { workspace = true, features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
rust_decimal = { version = "1", features = ["db-postgres"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
uuid.workspace = true
