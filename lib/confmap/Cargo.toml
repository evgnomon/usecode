[package]
name = "confmap"
version = "0.1.0"
edition = "2024"
description = "Query and update ConfigMap resources stored in PostgreSQL"
license = "HGL"
authors = ["Hamed Ghasemzadeh <hg@evgnomon.org>"]
publish = false

[[bin]]
name = "confmap"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
postgres = { version = "0.19", features = ["with-serde_json-1"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
