[package]
name = "usecode-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server for operating usecode agent"
license = "HGL"
authors = ["Hamed Ghasemzadeh <hg@evgnomon.org>"]

[[bin]]
name = "usecode-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
dotenvy = "0.15"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "charset", "http2"] }
rmcp = { version = "3.4", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "process"] }
