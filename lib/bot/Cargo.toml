[package]
name = "usecode-mcp"
version = "0.1.0"
edition.workspace = true
description = "MCP server for operating usecode agent"
license.workspace = true
authors.workspace = true

[[bin]]
name = "uc-agent-mcp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
dotenvy.workspace = true
reqwest = { workspace = true, features = ["json", "query", "rustls", "charset", "http2"] }
rmcp = { version = "3.4", features = ["server", "macros", "schemars", "transport-io"] }
schemars = "1"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-std", "process", "time"] }
