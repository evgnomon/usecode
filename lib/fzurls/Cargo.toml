[package]
name = "fzurls"
version = "0.1.0"
edition = "2024"
description = "Open URLs, files, searches or fzf-picked bookmarks in Brave"
license = "HGL"
authors = ["Hamed Ghasemzadeh <hg@evgnomon.org>"]
publish = false

[[bin]]
name = "fzurls"
path = "src/main.rs"

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
