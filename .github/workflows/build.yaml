# Builds, tests and packs every push with make, set up the same way as the
# release workflow (scripts/ci_dist_setup.sh), so what would break a release
# breaks here first. The vendored builds (CPython, vim, alacritty) take long
# and only change with their submodules, so they're left to the release
# workflow.
name: Build
on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SKIP: alacritty python vim
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Set up the dist tools
        run: ./scripts/ci_dist_setup.sh
      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: Dist
        run: make dist
      - name: Checksums
        run: cd dist && sha256sum *.deb > SHA256SUMS
