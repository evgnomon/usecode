# Builds, tests and packs every push with make, set up the same way as the
# release workflow (scripts/ci_dist_setup.sh), so what would break a release
# breaks here first. The vendored builds (CPython, vim, alacritty) aren't
# released, so they're left out here too. It runs on both arches the
# release ships, x86_64 and arm.
name: Build
on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs-on: ubuntu-latest
          # The vm image and its libvirt domain are x86_64 only.
          - runs-on: ubuntu-24.04-arm
            skip: vm
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    env:
      SKIP: alacritty python vim ${{ matrix.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Set up the dist tools
        run: ./scripts/ci_dist_setup.sh
      - name: Build
        run: make build
      - name: Test
        run: make test
      - name: Dist
        run: make dist
      - name: Checksums
        run: cd dist && sha256sum *.deb usecoded-* > SHA256SUMS
