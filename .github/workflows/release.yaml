# Builds the Debian packages with make dist on a v* tag, on x86_64 and on
# arm, and attaches both sets, with one SHA256SUMS, to the tag's GitHub
# release. alacritty, python and vim aren't released.
name: Release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  dist:
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-latest
            arch: amd64
          # The vm image and its libvirt domain are x86_64 only.
          - runs-on: ubuntu-24.04-arm
            arch: arm64
            skip: vm
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
    env:
      RELEASE: 1
      SKIP: alacritty python vim ${{ matrix.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Set up the dist tools
        run: ./scripts/ci_dist_setup.sh
      - name: Dist
        run: make dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  release:
    needs: dist
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.deb > SHA256SUMS
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes
          gh release upload "$TAG" dist/*.deb dist/SHA256SUMS --clobber
